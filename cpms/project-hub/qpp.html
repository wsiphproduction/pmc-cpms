<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Plan & Procedures | CPMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        html{
            font-size:0.75rem;
        }
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; padding: 25px; color: #1e293b; }
        
        /* Master Header Style */
        .project-header { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
        .info-label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
        .info-value { font-size: 0.9rem; font-weight: 600; color: #1e293b; margin-bottom: 12px; }

        /* Quality Upload Card */
        .quality-card {
            background-color: #f0f9ff;
            border: 2px dashed #bae6fd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .table thead th {
            background-color: #f1f5f9;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            border-top: none;
        }

        .btn-action {
            width: 32px;
            height: 32px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="project-header shadow-sm">
        <div class="row">
            <div class="col-md-3">
                <div class="info-label">NTP#</div>
                <div class="info-value text-primary">PMC-NTP-001</div>
            </div>
            <div class="col-md-3">
                <div class="info-label">Project Number</div>
                <div class="info-value">PRJ-2026-0882</div>
            </div>
            <div class="col-md-6">
                <div class="info-label">Project Title</div>
                <div class="info-value">Modernization of Main Control Room</div>
            </div>
            <div class="col-md-3">
                <div class="info-label">Service Contractor</div>
                <div class="info-value">BuildRight Solutions</div>
            </div>
            <div class="col-md-3">
                <div class="info-label">Job Site/Location</div>
                <div class="info-value">North Sector - Level 4</div>
            </div>
            <div class="col-md-6">
                <div class="info-label">Project Owner</div>
                <div class="info-value">Alex Rivera</div>
            </div>
        </div>
    </div>

    <div class="quality-card">
        <form id="qualityForm" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-bold">Document Label</label>
                <input type="text" id="qLabel" class="form-control" placeholder="e.g. Concrete Pouring ITP" required>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Type of Document</label>
                <select id="qType" class="form-select" required>
                    <option value="" selected disabled>Select Type...</option>
                    <option>Inspection & Test Plan (ITP)</option>
                    <option>Method Statement</option>
                    <option>Quality Control Procedure</option>
                    <option>Material Approval Request</option>
                    <option>Site Inspection Report</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-bold">Upload File</label>
                <input type="file" id="qFile" class="form-control" required>
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-info w-100 fw-bold text-white">
                    <i class="bi bi-file-earmark-arrow-up-fill me-2"></i>Upload File
                </button>
            </div>
        </form>
    </div>

    <div class="table-responsive border rounded bg-white shadow-sm">
        <table class="table table-hover align-middle mb-0" id="qualityTable">
            <thead>
                <tr>
                    <th width="80" class="text-center">Seq#</th>
                    <th>Label</th>
                    <th>Type of Document</th>
                    <th width="150" class="text-center">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="text-center text-muted">1</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <i class="bi bi-file-earmark-check-fill text-info me-2 fs-5"></i>
                            <span class="fw-semibold">Main Electrical Method Statement</span>
                        </div>
                    </td>
                    <td><span class="badge bg-info-subtle text-info border border-info-subtle">Method Statement</span></td>
                    <td class="text-center">
                        <button class="btn btn-outline-primary btn-action me-1" title="Download"><i class="bi bi-download"></i></button>
                        <button class="btn btn-outline-danger btn-action btn-delete" title="Delete"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script>
    $(document).ready(function() {
        let seq = 1;

        $('#qualityForm').on('submit', function(e) {
            e.preventDefault();
            seq++;
            
            const label = $('#qLabel').val();
            const type = $('#qType').val();

            const row = `
                <tr>
                    <td class="text-center text-muted">${seq}</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <i class="bi bi-file-earmark-check-fill text-info me-2 fs-5"></i>
                            <span class="fw-semibold">${label}</span>
                        </div>
                    </td>
                    <td><span class="badge bg-info-subtle text-info border border-info-subtle">${type}</span></td>
                    <td class="text-center">
                        <button class="btn btn-outline-primary btn-action me-1"><i class="bi bi-download"></i></button>
                        <button class="btn btn-outline-danger btn-action btn-delete"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `;

            $('#qualityTable tbody').prepend(row);
            this.reset();
            alert('Quality document has been uploaded successfully.');
        });

        $(document).on('click', '.btn-delete', function() {
            if(confirm('Are you sure you want to remove this quality procedure?')) {
                $(this).closest('tr').fadeOut(300, function() { $(this).remove(); });
            }
        });
    });
</script>

</body>
</html>
